name: Build Miad Android APK
# Rebuild after the Capacitor WebView asset-path and service-worker fixes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/android-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing GitHub Actions secret: VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing GitHub Actions secret: VITE_SUPABASE_PUBLISHABLE_KEY" && exit 1)
          # ننظف القيم من أي رموز مخفية أو مسافات أو اقتباسات (تلتصق أحياناً عند اللصق من الجوال)
          RAW_URL_LEN=${#VITE_SUPABASE_URL}
          RAW_KEY_LEN=${#VITE_SUPABASE_PUBLISHABLE_KEY}
          export VITE_SUPABASE_URL=$(printf '%s' "$VITE_SUPABASE_URL" | LC_ALL=C tr -cd '\041-\176' | tr -d '"'"'"'')
          export VITE_SUPABASE_PUBLISHABLE_KEY=$(printf '%s' "$VITE_SUPABASE_PUBLISHABLE_KEY" | LC_ALL=C tr -cd '\041-\176' | tr -d '"'"'"'')
          echo "URL length: raw=$RAW_URL_LEN clean=${#VITE_SUPABASE_URL} | KEY length: raw=$RAW_KEY_LEN clean=${#VITE_SUPABASE_PUBLISHABLE_KEY}"
          echo "URL starts with: $(printf '%s' "$VITE_SUPABASE_URL" | cut -c1-8) | host suffix: $(printf '%s' "$VITE_SUPABASE_URL" | sed 's#.*\.##' | cut -c1-12)"
          echo "$VITE_SUPABASE_URL" | grep -Eq '^https://[A-Za-z0-9.-]+\.supabase\.co/?$' || { echo "VITE_SUPABASE_URL must look like https://xxxx.supabase.co (no path like /rest/v1)"; exit 1; }
          test ${#VITE_SUPABASE_PUBLISHABLE_KEY} -gt 20 || { echo "VITE_SUPABASE_PUBLISHABLE_KEY looks too short"; exit 1; }
          npm run build

      - name: Verify web build output
        run: |
          test -s dist/index.html || { echo "dist/index.html is missing or empty"; exit 1; }
          grep -q 'assets/' dist/index.html || { echo "dist/index.html does not reference assets/"; exit 1; }
          ls dist/assets | grep -q '\.js$' || { echo "No JS bundle in dist/assets"; exit 1; }
          if grep -Eq '(src|href)="/assets/' dist/index.html; then echo "Absolute /assets paths found; Capacitor needs relative paths"; exit 1; fi
          echo "dist OK:"; ls -la dist dist/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Prepare Firebase push
        run: python3 scripts/prepare-android-push.py

      - name: Verify assets inside Android project
        run: |
          test -s android/app/src/main/assets/public/index.html || { echo "index.html missing from Android assets"; exit 1; }
          ls android/app/src/main/assets/public/assets | grep -q '\.js$' || { echo "JS bundle missing from Android assets"; exit 1; }
          cat android/app/src/main/assets/capacitor.config.json
          echo "Android assets OK"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miad-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
