<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E3B36" />
    <meta name="description" content="مِيعاد — تنظيم الاجتماعات والمهام والتذكيرات" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="مِيعاد" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- حارس الإقلاع: سكربت عادي يعمل قبل أي وحدة JavaScript، حتى لا تظهر شاشة بيضاء صامتة عند أي فشل -->
    <script>
      (function () {
        var shown = false;
        window.__miadBooted = false;

        function line(label, value) {
          return label + ": " + value;
        }

        function details(err, where) {
          var env = window.__miadEnv || {};
          var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
          var msg = err && (err.stack || err.message) ? (err.stack || err.message) : String(err);
          return [
            line("الخطأ", String(msg).slice(0, 700)),
            line("المرحلة", where || "-"),
            line("تطبيق أندرويد", native ? "نعم" : "لا"),
            line("إعداد Supabase", env.configured === undefined ? "لم يُقرأ بعد" : (env.source + " / " + env.host)),
            line("الاتصال", navigator.onLine ? "متصل" : "غير متصل"),
            line("العنوان", location.href),
            line("المتصفح", navigator.userAgent),
          ].join("\n");
        }

        window.__miadShowFatal = function (err, where) {
          if (shown) return;
          shown = true;
          try { console.error("[miad] fatal:", where, err); } catch (e) {}
          var text = details(err, where);

          var box = document.createElement("div");
          box.id = "miad-fatal";
          box.setAttribute("dir", "rtl");
          box.style.cssText = "position:fixed;inset:0;z-index:2147483647;overflow:auto;background:#F3F6F4;color:#16231F;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;padding:24px 20px;box-sizing:border-box;";

          var card = document.createElement("div");
          card.style.cssText = "max-width:460px;margin:8vh auto 0;background:#fff;border:1px solid #DFE7E3;border-radius:20px;padding:24px 20px;";

          var h = document.createElement("h1");
          h.textContent = "تعذّر تشغيل مِيعاد";
          h.style.cssText = "margin:0 0 8px;font-size:22px;color:#0E3B36;";

          var p = document.createElement("p");
          p.textContent = "حدث خطأ غير متوقع أثناء فتح التطبيق. اضغط «إعادة المحاولة»، وإن تكرر الخطأ فانسخ التفاصيل وأرسلها للدعم.";
          p.style.cssText = "margin:0 0 16px;line-height:1.8;color:#555C5A;font-size:15px;";

          var pre = document.createElement("pre");
          pre.textContent = text;
          pre.setAttribute("dir", "ltr");
          pre.style.cssText = "margin:0 0 16px;padding:12px;border-radius:12px;background:#F3F6F4;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:38vh;overflow:auto;text-align:left;";

          var row = document.createElement("div");
          row.style.cssText = "display:flex;gap:10px;";

          function btn(label, primary, onClick) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = label;
            b.style.cssText = "flex:1;height:48px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;border:1.5px solid " + (primary ? "#E0A02E" : "#DFE7E3") + ";background:" + (primary ? "#E0A02E" : "#fff") + ";color:#0A2D29;";
            b.addEventListener("click", onClick);
            return b;
          }

          row.appendChild(btn("إعادة المحاولة", true, function () { location.reload(); }));
          row.appendChild(btn("نسخ التفاصيل", false, function (e) {
            var done = function () { e.target.textContent = "تم النسخ"; };
            try {
              navigator.clipboard.writeText(text).then(done, function () {});
            } catch (x) {}
          }));

          card.appendChild(h); card.appendChild(p); card.appendChild(pre); card.appendChild(row);
          box.appendChild(card);
          (document.body || document.documentElement).appendChild(box);
        };

        // أخطاء JavaScript غير الملتقطة وفشل تحميل ملفات السكربت/الأنماط
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t !== window && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            window.__miadShowFatal(new Error("تعذّر تحميل الملف: " + (t.src || t.href)), "تحميل الملفات");
            return;
          }
          if (!window.__miadBooted) window.__miadShowFatal(e.error || e.message, "الإقلاع");
        }, true);

        window.addEventListener("unhandledrejection", function (e) {
          if (!window.__miadBooted) window.__miadShowFatal(e.reason, "الإقلاع (وعد مرفوض)");
        });

        // مهلة أمان: لو لم يبدأ التطبيق خلال 12 ثانية نعرض التفاصيل بدل الشاشة البيضاء
        setTimeout(function () {
          if (!window.__miadBooted) window.__miadShowFatal(new Error("لم يكتمل تشغيل التطبيق خلال 12 ثانية"), "مهلة الإقلاع");
        }, 12000);
      })();
    </script>

    <title>مِيعاد | إدارة الاجتماعات والمهام</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
